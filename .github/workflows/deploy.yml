name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The game app lives in client/; every `run:` step works from there.
defaults:
  run:
    working-directory: client

# One deploy at a time, and never cancel one halfway: a cancelled deploy can leave
# the site serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the root: the app lives in client/.
          package_json_file: client/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Lint chay o day chu khong chi trong ci.yml: `build` bat duoc loi kieu
      # nhung khong bat vi pham lint, va mot push thang vao `main` khong di
      # qua pull request.
      - run: pnpm lint

      # The tests run here rather than trusting the CI workflow: `ci.yml` only fires
      # on pull requests, and a deploy that assumes a green run it cannot see is a
      # deploy that will eventually ship a red one.
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
        env:
          # Set ONLY here. It switches on basePath for the /web-game-duck-match
          # sub-path; `pnpm dev` and a local build stay at the root, so opening a
          # local out/index.html does not break every asset path (ADR-0006).
          #
          # Ducker ID sign-in is shipped dark: the flag and the DUCKER_* vars are
          # deliberately NOT passed here, so the deployed build renders no button
          # (ADR-0012).
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # The budget is re-measured against the Pages build, because basePath changes
      # every asset URL in the HTML and that is what the gate reads.
      - name: First-load JS budget
        run: |
          node scripts/check-bundle-size.mjs out
          node scripts/check-bundle-size.mjs out play/1/index.html

      # Do NOT add `enablement: true`. The default GITHUB_TOKEN can deploy to an
      # existing Pages site but cannot create one — that is a repository admin
      # operation. Pages is switched on once, by hand, with the command in the
      # README. See ADR-0006.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          # Next's static export writes `out`, not `dist`.
          path: client/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy job is not a working site. Checked the obvious way once and it
  # lied: curl reported 200 for the Pages URL while the body was GitHub's own
  # "Site not found" page. This opens the real URL and plays a move: the deploy
  # module of the regression suite with ENV=prd, whose URL lives once in
  # automation-testing/src/config/urls.ts (ADR-0007).
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-testing
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the root: pnpm comes from the app's packageManager pin.
          package_json_file: client/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: automation-testing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Play the deployed site
        run: pnpm exec playwright test src/tests/e2e/deploy --project=app
        env:
          ENV: prd
